  <script>
    // Suppress harmless third-party browser extension message port errors in production & dev
    window.addEventListener('unhandledrejection', function (event) {
      var msg = (event && event.reason && event.reason.message) || String(event && event.reason || '');
      if (
        msg.indexOf('message channel closed before a response was received') !== -1 ||
        msg.indexOf('A listener indicated an asynchronous response') !== -1
      ) {
        event.preventDefault();
      }
    });
  </script>
